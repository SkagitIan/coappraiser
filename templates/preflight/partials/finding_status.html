<form method="post" action="{% url 'preflight:decision' finding.pk %}" hx-post="{% url 'preflight:decision' finding.pk %}" hx-target="#finding-{{ finding.pk }}" hx-swap="innerHTML" class="styled-form"><input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}"><p><label for="status-{{ finding.pk }}">Decision</label><select id="status-{{ finding.pk }}" name="status"><option value="open" {% if finding.decision.status == "open" %}selected{% endif %}>Keep open</option><option value="resolved" {% if finding.decision.status == "resolved" %}selected{% endif %}>Mark resolved</option><option value="dismissed" {% if finding.decision.status == "dismissed" %}selected{% endif %}>Dismiss</option><option value="accepted_risk" {% if finding.decision.status == "accepted_risk" %}selected{% endif %}>Accept risk</option></select></p><button class="button secondary" type="submit">Save decision</button><small>Current: {{ finding.decision.get_status_display }}</small></form>
