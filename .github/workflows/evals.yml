name: CoAppraiser evals

on:
  push:
  pull_request:

jobs:
  deterministic-evals:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      COAPPRAISER_LLM_PROVIDER: mock
      COAPPRAISER_LLM_MODEL: mock-revision-response
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python evals/run.py
      - run: python manage.py test evals apps.ai_tools --noinput
